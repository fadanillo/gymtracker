<style>
  :root{
    --bg:#131319;
    --surface:#1c1d25;
    --surface-2:#252631;
    --border:#33343f;
    --text:#f2f0ea;
    --text-dim:#93949f;
    --text-faint:#5c5d68;
    --accent:#ff5a36;
    --accent-2:#ffb35a;
    --success:#4ade80;
    --danger:#ff6161;
    --radius:16px;
    --radius-sm:10px;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Hind Guntur',sans-serif;height:100%;}
  body{overscroll-behavior-y:none;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  .h-title{font-family:'Hind Guntur',sans-serif;font-weight:600;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--bg) 80%, transparent);
    padding:18px 18px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .back-btn{
    width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--text);
  }
  .back-btn svg{width:18px;height:18px;}
  .header-title{font-family:'Hind Guntur',sans-serif;font-size:1.35rem;font-weight:600;flex:1;letter-spacing:0.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .header-sub{font-size:0.78rem;color:var(--text-dim);font-weight:400;font-family:'Hind Guntur',sans-serif;letter-spacing:0;}

  /* ---------- Streak badge ---------- */
  .streak-badge{
    width:46px;height:46px;border-radius:50%;flex:none;position:relative;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:var(--surface-2);
    border:1px solid var(--border);transition:box-shadow .3s ease;
  }
  .streak-badge svg, .streak-badge .emoji{width:28px;height:28px;}
  .streak-badge .emoji{font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .streak-count{
    position:absolute;bottom:-6px;right:-6px;background:var(--accent);color:#fff;font-family:'JetBrains Mono',monospace;
    font-size:0.62rem;font-weight:700;border-radius:20px;padding:2px 5px;min-width:16px;text-align:center;
    border:2px solid var(--bg);
  }

  main{flex:1;padding:0 18px 100px;}

  /* ---------- Group grid (home) ---------- */
  .intro{padding:4px 0 20px;}
  .intro h1{font-family:'Hind Guntur',sans-serif;font-size:1.9rem;margin:0 0 4px;font-weight:700;}
  .intro p{margin:0;color:var(--text-dim);font-size:0.9rem;}

  .today-card{
    display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 14px 14px 12px;margin-bottom:18px;
  }
  .today-badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .today-info{flex:1;min-width:0;}
  .today-top-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .today-streak{font-family:'Hind Guntur',sans-serif;font-size:0.95rem;font-weight:700;white-space:nowrap;}
  .today-week-count{font-size:0.72rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  .today-mark-btn{
    flex:none;width:40px;height:40px;border-radius:12px;border:none;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .today-mark-btn svg{width:18px;height:18px;}
  .today-mark-btn.done{background:var(--success);font-size:1.1rem;font-weight:700;color:#0a0a0a;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .group-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 16px;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:120px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .group-card:active{transform:scale(0.97);}
  .group-icon-chip{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;}
  .group-icon-chip svg{width:24px;height:24px;}

const firebaseConfig = {

};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";
const FIREBASE_SDK_LOADED = typeof firebase !== 'undefined';
let fbApp=null, auth=null, db=null, currentUser=null;
if(FIREBASE_CONFIGURED && FIREBASE_SDK_LOADED){
  fbApp = firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}

/* ===================== DATA / CONSTANTS ===================== */
const GROUPS = [
  {id:'chest', name:'Chest', color:'#ff5a36', icon:`<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 10v28"/><path d="M23 12c-2-4-8-6-13-3-5 3-6 10-2 15 3 4 9 7 14 8 1-6 1-14 1-20z"/><path d="M25 12c2-4 8-6 13-3 5 3 6 10 2 15-3 4-9 7-14 8-1-6-1-14-1-20z"/></svg>`},

  {id:'shoulders', name:'Shoulders', color:'#ffb35a', icon:`<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="18" r="7"/><circle cx="36" cy="18" r="7"/><path d="M5 34c2-6 5-9 7-9M43 34c-2-6-5-9-7-9M19 18h10"/></svg>`},
  {id:'arms', name:'Arms', color:'#4ade80', icon:`<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 40 24 26"/><circle cx="8" cy="42" r="5"/><path d="M24 26c-4-2-6-8-2-13 3-4 9-4 12-1 4 4 2 10-2 13" fill="none"/><circle cx="38" cy="10" r="6"/></svg>`},

const ICONS = {
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,

  dumbbell:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20v8M11 16v16M37 16v16M42 20v8M11 24h26"/></svg>`,
};

const STAGE_LABELS = ["Chicken still asleep","First set","Warming up","Getting in shape","Steady rhythm",
  "Confident arm","Strength rising","Definition appearing","Pumped arm","Veins showing","Explosive power","On fire!"];

/* ===================== STORAGE (Firebase Firestore, per user) ===================== */
const DEFAULTS = {
  exercises: {chest:[], back:[], shoulders:[], arms:[], legs:[]},
  logs: {},
  trainingDays: [],
  settings: {weeklyGoal:4}
};
let DB = JSON.parse(JSON.stringify(DEFAULTS));

// local cache: instant redisplay + offline fallback only (source of truth is Firestore)
function cacheLocally(){
  try{ localStorage.setItem('gymtracker:cache', JSON.stringify(DB)); }catch(e){}
}
function loadLocalCache(){
  try{
    const raw = localStorage.getItem('gymtracker:cache');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}

function metaRef(){ return db.collection('users').doc(currentUser.uid); }
function exercisesCol(){ return db.collection('users').doc(currentUser.uid).collection('exercises'); }

async function cloudLoadAll(){
  const cached = loadLocalCache();
  if(cached) DB = cached; // instant paint while we fetch fresh data
  try{
    const [metaSnap, exSnap] = await Promise.all([ metaRef().get(), exercisesCol().get() ]);
    const meta = metaSnap.exists ? metaSnap.data() : {};
    const freshExercises = {chest:[], back:[], shoulders:[], arms:[], legs:[]};
    const freshLogs = {};
    exSnap.forEach(docSnap=>{
      const d = docSnap.data();
      const exObj = {id:docSnap.id, name:d.name, photo:d.photo||null};
      if(!freshExercises[d.groupId]) freshExercises[d.groupId] = [];
      freshExercises[d.groupId].push(exObj);
      freshLogs[docSnap.id] = d.logs || [];
    });
    DB.exercises = freshExercises;
    DB.logs = freshLogs;
    DB.trainingDays = meta.trainingDays || [];
    DB.settings = {weeklyGoal: meta.weeklyGoal!==undefined ? meta.weeklyGoal : 4};
    cacheLocally();
  }catch(e){
    console.error('cloud load failed', e);
    if(cached){ showToast('Offline — showing your last saved data.'); }
    else { showToast('Could not load your data. Check your connection.'); }
  }
}

async function cloudSaveExercise(ex, groupId){
  cacheLocally();
  try{
    await exercisesCol().doc(ex.id).set({
      groupId,
      name: ex.name,
      photo: ex.photo || null,
      logs: DB.logs[ex.id] || []
    });
    return true;
  }catch(e){
    console.error('save exercise failed', e);
    showToast('Could not sync to the cloud. Saved on this device only.');
    return false;
  }
}
async function cloudDeleteExercise(exId){
  cacheLocally();
  try{ await exercisesCol().doc(exId).delete(); return true; }
  catch(e){ console.error('delete failed', e); showToast('Could not delete from the cloud.'); return false; }
}
async function cloudSaveMeta(){
  cacheLocally();
  try{
    await metaRef().set({weeklyGoal: DB.settings.weeklyGoal, trainingDays: DB.trainingDays}, {merge:true});
    return true;
  }catch(e){
    console.error('save meta failed', e);
    showToast('Could not sync to the cloud. Saved on this device only.');
    return false;
  }
}

function showToast(msg){
  let host = document.getElementById('toast-host');
  if(!host){
    host = document.createElement('div');
    host.id = 'toast-host';
    host.style.cssText = 'position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function todayISO(){
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Jerusalem'
  }).format(new Date());
}
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US', {day:'2-digit', month:'short'});
}
function sundayOf(iso){
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
  const dow = dt.getUTCDay();
  const sun = new Date(Date.UTC(y, m - 1, d - dow, 12, 0, 0));
  return sun.toISOString().slice(0, 10);
}

function addDays(iso, n){
  const [y, m, d] = iso.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d + n, 12, 0, 0));
  return dt.toISOString().slice(0, 10);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function getExercise(exId){

}

/* ===================== STREAK LOGIC ===================== */
function computeStreak(){
  const goal        = Math.max(1, DB.settings.weeklyGoal);
  const days        = [...new Set(DB.trainingDays)].sort();
  const currentWeek = sundayOf(todayISO());

  if(days.length === 0){
    return {
      streak:0,
      thisWeekCount:0,
      goal:DB.settings.weeklyGoal,
      weeks:[],
      thisWeekMet:false
    };
  }

  // Bucket by Sunday-anchored week; ignore future workouts
  const buckets = {};
  days.forEach(d => {
    const wk = sundayOf(d);
    if(wk > currentWeek) return;
    (buckets[wk] = buckets[wk] || new Set()).add(d);
  });

  const thisWeekCount = buckets[currentWeek]
    ? buckets[currentWeek].size
    : 0;

  const thisWeekMet = thisWeekCount >= goal;

  // Walk backward from the current week counting consecutive completed weeks
  let streak = 0;
  let cursor = currentWeek;
  const earliestWeek = sundayOf(days[0]);

  while(cursor >= earliestWeek){
    const cnt = buckets[cursor]
      ? buckets[cursor].size
      : 0;

    if(cnt >= goal){
      streak++;
      cursor = addDays(cursor, -7);
    }else{
      break;
    }
  }

  // Last 8 completed (non-current) weeks for the dots UI
  const weeks = [];

  for(let i = 8; i >= 1; i--){
    const wk = addDays(currentWeek, -7 * i);
    const cnt = buckets[wk]
      ? buckets[wk].size
      : 0;

    weeks.push(cnt >= goal);
  }

  return {
    streak,
    thisWeekCount,
    goal:DB.settings.weeklyGoal,
    weeks,
    thisWeekMet
  };
}

function levelFromStreak(streak){ return Math.max(0, Math.min(11, streak)); }

function chickenFootSVG(size){

    <g stroke="#d9ac52" stroke-width="1.3" opacity="0.6">
      <path d="M41 24h18M41 30h18M41 36h18M41 42h18M41 48h18M41 54h18"/>
    </g>
    <path d="M46 60 L36 51" stroke="#f0c869" stroke-width="8" stroke-linecap="round"/>
    <path d="M36 51 l-4 -4" stroke="#8a6a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 62 L28 78" stroke="#f0c869" stroke-width="9" stroke-linecap="round"/>
    <path d="M28 78 l-6 3" stroke="#8a6a2a" stroke-width="3" stroke-linecap="round"/>

    <path d="M50 86 l0 7" stroke="#8a6a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M54 62 L72 78" stroke="#f0c869" stroke-width="9" stroke-linecap="round"/>
    <path d="M72 78 l6 3" stroke="#8a6a2a" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

function armBadgeSVG(level, size){
  if(level===0){
    return chickenFootSVG(size);
  }
  const t = level/11;
  const bulgeRx = 9 + level*1.9;
  const bulgeRy = 7 + level*1.35;
  // skin color: pale -> tan -> deep red-orange
  const c1=[232,196,166], c2=[201,124,72], c3=[214,74,46];
  let r,g,b;
  if(t<0.55){ const k=t/0.55; r=c1[0]+(c2[0]-c1[0])*k; g=c1[1]+(c2[1]-c1[1])*k; b=c1[2]+(c2[2]-c1[2])*k; }
  else { const k=(t-0.55)/0.45; r=c2[0]+(c3[0]-c2[0])*k; g=c2[1]+(c3[1]-c2[1])*k; b=c2[2]+(c3[2]-c2[2])*k; }
  const skin = `rgb(${r|0},${g|0},${b|0})`;
  const veinOpacity = level>=8 ? Math.min(1,(level-7)/3.5) : 0;
  const fireOn = level>=11;

  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="${fireOn?'flame-glow':''}">
    <line x1="20" y1="83" x2="46" y2="53" stroke="${skin}" stroke-width="24" stroke-linecap="round"/>
    <circle cx="18" cy="85" r="15" fill="${skin}"/>
    <line x1="46" y1="53" x2="70" y2="22" stroke="${skin}" stroke-width="20" stroke-linecap="round"/>
    <circle cx="72" cy="20" r="12" fill="${skin}"/>
    <ellipse cx="49" cy="46" rx="${bulgeRx}" ry="${bulgeRy}" fill="${skin}" transform="rotate(-40 49 46)"/>
    ${veinOpacity>0?`
      <path d="M38,54 Q47,44 54,32" stroke="rgba(90,40,30,${veinOpacity})" stroke-width="1.6" fill="none"/>
      <path d="M43,58 Q52,47 60,36" stroke="rgba(90,40,30,${veinOpacity*0.8})" stroke-width="1.3" fill="none"/>
    `:''}
    ${fireOn?`
      <g opacity="0.92">
        <path d="M49 20c4 6-2 9-1 14 4-1 7-6 5-11 5 4 7 11 2 16-4 4-11 3-13-2-2-4 0-9 3-11z" fill="#ffb35a"/>
        <path d="M49 26c2 3-1 5-1 7 2-1 4-3 3-6 3 2 3 6 0 8-2 2-6 1-7-1-1-2 0-5 2-7z" fill="#ff5a36"/>
      </g>
    `:''}
  </svg>`;
}

/* ===================== IMAGE COMPRESSION ===================== */
function compressImage(dataUrl, maxSize=480, quality=0.72){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let {width, height} = img;
      if(width>height){ if(width>maxSize){ height*=maxSize/width; width=maxSize; } }
      else { if(height>maxSize){ width*=maxSize/height; height=maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}

function renderHistoryTab(ex, logs){
  if(logs.length===0){
    return `
      <div class="empty-state">
        ${ICONS.chartBig}
        <p>No data for the chart yet.<br>Log your first workout and progress will show up here.</p>
      </div>`;
  }

  const asc = logs.slice().reverse();
  const points = asc.map(l=>{
    const top = Math.max(...l.sets.map(s=>Number(s.weight)||0));
    return {date:l.date, top, sets:l.sets};
  });

  const maxW = Math.max(...points.map(p=>p.top));
  const minW = Math.min(...points.map(p=>p.top));
  const padding = Math.max(5, Math.round((maxW*0.3)/2.5)*2.5);
  let yMax = Math.ceil((maxW+padding)/5)*5;
  let yMin = Math.max(0, Math.floor((minW-padding)/5)*5);
  if(yMax===yMin) yMax = yMin+10;

  const W=480, H=200, padL=36, padR=12, padT=14, padB=26;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const xStep = points.length>1 ? plotW/(points.length-1) : 0;
  const xOf = i => padL + (points.length>1 ? i*xStep : plotW/2);
  const yOf = v => padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;

  const linePath = points.map((p,i)=>`${i===0?'M':'L'}${xOf(i).toFixed(1)},${yOf(p.top).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${xOf(points.length-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${xOf(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  const gridLines = [];
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = yMin + (yMax-yMin)*i/steps;
    const y = yOf(val);
    gridLines.push(`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`);
    gridLines.push(`<text x="4" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--text-faint)" font-family="JetBrains Mono">${Math.round(val)}</text>`);
  }

  const dateLabels = points.map((p,i)=>{
    if(points.length>6 && i%Math.ceil(points.length/6)!==0 && i!==points.length-1) return '';
    return `<text x="${xOf(i).toFixed(1)}" y="${H-6}" font-size="9" fill="var(--text-faint)" font-family="JetBrains Mono" text-anchor="middle">${fmtDate(p.date)}</text>`;
  }).join('');

  const dots = points.map((p,i)=>`
    <circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.top).toFixed(1)}" r="4" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"
      data-action="chart-point" data-idx="${i}" style="cursor:pointer"/>
  `).join('');

  const lastEntry = points[points.length-1];
  const best = Math.max(...points.map(p=>p.top));

  return `
    <div class="chart-stats">
      <div class="stat-pill"><div class="num">${best}<span style="font-size:0.6em">kg</span></div><div class="lbl">Best</div></div>
      <div class="stat-pill"><div class="num">${lastEntry.top}<span style="font-size:0.6em">kg</span></div><div class="lbl">Last</div></div>
      <div class="stat-pill"><div class="num">${points.length}</div><div class="lbl">Workouts</div></div>
    </div>
    <div class="chart-wrap" style="position:relative;">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${gridLines.join('')}
        <path d="${areaPath}" fill="url(#areaGrad)"/>
        <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
        ${dateLabels}
      </svg>
      <div id="chart-tooltip"></div>
    </div>
    <div class="log-list">
      ${asc.slice().reverse().map(l=>`
        <div class="log-item">
          <div class="l-date">${fmtDate(l.date)}</div>
          <div class="l-sets">
            ${l.sets.map((s,i)=>`<span class="l-set-chip">Set ${i+1}: <b>${s.reps}</b>×<b>${s.weight}</b>kg</span>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

        </div>
      </div>
      <div class="info-tip">A week counts toward your streak if your number of workouts that week (Mon–Sun) meets your goal. Otherwise the streak resets to 0.</div>
      ${currentUser ? `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);">
          <span style="font-size:0.78rem;color:var(--text-dim);">${escapeHtml(currentUser.email||'')}</span>
          <span style="font-size:0.78rem;color:var(--danger);font-weight:600;cursor:pointer;" data-action="sign-out">Sign out</span>
        </div>
      ` : ''}
    </div>
  </div>`;
}
function weekWord(n){
  return n === 1 ? 'week' : 'weeks';
}

/* ===================== EVENT HANDLERS ===================== */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  const nameInput = document.getElementById('ex-name-input');
  if(nameInput){ nameInput.oninput = e=>{ modal.name = e.target.value; }; }

  document.querySelectorAll('input[data-role]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.i;
      const role = e.target.dataset.role;
      const ex = getExercise(state.exerciseId).ex;
      window.__draftSets[ex.id][i][role] = e.target.value;
    });
  });

  const photoInput = document.getElementById('photo-input');
  if(photoInput){
    photoInput.addEventListener('change', async e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async ev=>{
        const compressed = await compressImage(ev.target.result);
        pendingPhoto = compressed;
        render();
      };
      reader.readAsDataURL(file);
    });
  }
}

async function onAction(e){
  e.stopPropagation();
  const el = e.currentTarget;
  const action = el.dataset.action;

  if(action==='open-group'){ state.groupId = el.dataset.id; state.screen='group'; render(); }
  else if(action==='open-exercise'){ state.exerciseId = el.dataset.id; state.exTab='log'; delete window.__draftSets?.[el.dataset.id]; state.screen='exercise'; render(); }
  else if(action==='back'){
    if(state.screen==='exercise') state.screen='group';
    else if(state.screen==='group') state.screen='home';
    render();
  }
  else if(action==='ex-tab'){ state.exTab = el.dataset.tab; render(); }

  else if(action==='add-exercise'){ modal={type:'add-exercise', name:''}; pendingPhoto=null; render(); }
  else if(action==='edit-exercise'){ modal={type:'edit-exercise'}; pendingPhoto=null; render(); }
  else if(action==='delete-exercise'){
    const found = getExercise(state.exerciseId);
    if(found && confirm(`Delete exercise "${found.ex.name}"?`)){
      DB.exercises[found.groupId] = DB.exercises[found.groupId].filter(x=>x.id!==state.exerciseId);
      delete DB.logs[state.exerciseId];
      cloudDeleteExercise(state.exerciseId);
      state.screen='group'; render();
    }
  }
  else if(action==='pick-photo'){ document.getElementById('photo-input').click(); }
  else if(action==='close-modal' || action==='close-modal-bg'){
    if(action==='close-modal-bg' && el !== e.target) return;
    modal=null; pendingPhoto=null; render();
  }
  else if(action==='save-new-exercise'){
    const name = (modal.name||'').trim();
    if(!name){ shake('ex-name-input'); return; }
    const newEx = {id:uid(), name, photo: pendingPhoto||null};
    DB.exercises[state.groupId].push(newEx);
    cloudSaveExercise(newEx, state.groupId);
    modal=null; pendingPhoto=null; render();
  }
  else if(action==='save-edit-exercise'){
    const nameInput = document.getElementById('ex-name-input');
    const name = (nameInput.value||'').trim();
    if(!name){ shake('ex-name-input'); return; }
    const found = getExercise(state.exerciseId);
    found.ex.name = name;
    if(pendingPhoto!==null) found.ex.photo = pendingPhoto;
    cloudSaveExercise(found.ex, found.groupId);
    modal=null; pendingPhoto=null; render();
  }

  else if(action==='step-reps' || action==='step-weight'){
    const i = +el.dataset.i;
    const d = parseFloat(el.dataset.d);
    const ex = getExercise(state.exerciseId).ex;
    const role = action==='step-reps' ? 'reps' : 'weight';
    const cur = parseFloat(window.__draftSets[ex.id][i][role]) || 0;
    let next = cur + d;
    if(next<0) next=0;
    window.__draftSets[ex.id][i][role] = role==='weight' ? (Math.round(next*2)/2) : Math.round(next);
    render();
  }
  else if(action==='save-log'){
    const ex = getExercise(state.exerciseId).ex;
    const draft = window.__draftSets[ex.id];
    const validSets = draft
      .map(r=>({reps:parseFloat(r.reps)||0, weight:parseFloat(r.weight)||0}))
      .filter(r=>r.reps>0);
    if(validSets.length===0){ alert('Fill in at least one set (reps).'); return; }
    const today = todayISO();
    const existingIdx = (DB.logs[ex.id]||[]).findIndex(l=>l.date===today);
    if(!DB.logs[ex.id]) DB.logs[ex.id] = [];
    if(existingIdx>=0) DB.logs[ex.id][existingIdx] = {date:today, sets:validSets};
    else DB.logs[ex.id].push({date:today, sets:validSets});
    if(!DB.trainingDays.includes(today)) DB.trainingDays.push(today);
    const found = getExercise(ex.id);
    cloudSaveExercise(ex, found.groupId);
    cloudSaveMeta();
    delete window.__draftSets[ex.id];
    state.exTab='history';
    render();
  }
  else if(action==='chart-point'){
    // handled via mouseover/tap below (simplified: show alert-free tooltip inline)
  }

  else if(action==='open-streak'){ modal={type:'streak'}; render(); }
  else if(action==='mark-today'){
    const today = todayISO();
    if(!DB.trainingDays.includes(today)){
      DB.trainingDays.push(today);
      cloudSaveMeta();
      render();
    }
  }
  else if(action==='goal-step'){
    const d = parseInt(el.dataset.d);
    DB.settings.weeklyGoal = Math.max(0, Math.min(7, DB.settings.weeklyGoal + d));
    cloudSaveMeta();
    render();
  }
  else if(action==='sign-out'){
    if(confirm('Sign out of your account on this device?')){
      auth.signOut();
    }
  }
}

function shake(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.borderColor = 'var(--danger)';
  setTimeout(()=>{ el.style.borderColor = 'var(--border)'; }, 700);
}

/* chart tooltip via delegated hover/tap */
document.addEventListener('click', e=>{
  const pt = e.target.closest('[data-action="chart-point"]');
  const tipHost = document.getElementById('chart-tooltip');
  if(!pt){ if(tipHost) tipHost.innerHTML=''; return; }
  e.stopPropagation();
  const idx = +pt.dataset.idx;
  const found = getExercise(state.exerciseId);
  if(!found) return;
  const logs = (DB.logs[found.ex.id]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const entry = logs[idx];
  if(!entry || !tipHost) return;
  const cx = pt.getAttribute('cx'), cy = pt.getAttribute('cy');
  const svg = pt.closest('svg');
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const px = rect.left + (cx/vb.width)*rect.width;
  const py = rect.top + (cy/vb.height)*rect.height;
  const wrapRect = tipHost.parentElement.getBoundingClientRect();
  tipHost.innerHTML = `<div class="tooltip" style="left:${px-wrapRect.left}px; top:${py-wrapRect.top}px;">
    <div class="t-date">${fmtDate(entry.date)}</div>
    <div class="t-sets">${entry.sets.map(s=>`${s.reps}×${s.weight}kg`).join(' · ')}</div>
  </div>`;
});

/* ===================== AUTH SCREEN ===================== */
let authMode = 'signin'; // 'signin' | 'signup'
let authError = '';
let authBusy = false;

function friendlyAuthError(code){
  const map = {
    'auth/invalid-email':'That email address looks invalid.',
    'auth/user-not-found':'No account found with that email.',
    'auth/wrong-password':'Incorrect password.',
    'auth/invalid-credential':'Incorrect email or password.',
    'auth/email-already-in-use':'An account with that email already exists.',
    'auth/weak-password':'Password should be at least 6 characters.',
    'auth/too-many-requests':'Too many attempts. Try again in a bit.',
    'auth/network-request-failed':'Network error. Check your connection.',
  };
  return map[code] || 'Something went wrong. Please try again.';
}

function renderAuthScreen(){
  if(!FIREBASE_SDK_LOADED){
    return `
    <div class="auth-wrap">
      <div class="auth-logo">${ICONS.dumbbell}</div>
      <h1>Connection problem</h1>
      <p class="auth-sub">The Firebase library couldn't load. Check your internet connection and reload the page. If this keeps happening, the network you're on may be blocking cdnjs.cloudflare.com.</p>
      <button class="primary-btn" onclick="location.reload()">Reload</button>
    </div>`;
  }
  if(!FIREBASE_CONFIGURED){
    return `
    <div class="auth-wrap">
      <div class="auth-logo">${ICONS.dumbbell}</div>
      <h1>Almost there</h1>
      <p class="auth-sub">Firebase isn't connected yet, so your data can't sync across devices. Open the file, find the <span class="mono">firebaseConfig</span> section near the top of the script, and paste in your own project's config from the Firebase console.</p>
      <div class="auth-hint">Firebase console → Project settings → Your apps → Web app config</div>
    </div>`;
  }
  return `
  <div class="auth-wrap">
    <div class="auth-logo">${ICONS.dumbbell}</div>
    <h1>Your Gym</h1>
    <p class="auth-sub">Sign in to sync your exercises and progress across all your devices.</p>
    <div class="auth-tabs">
      <div class="auth-tab ${authMode==='signin'?'active':''}" data-action="auth-tab" data-mode="signin">Sign in</div>
      <div class="auth-tab ${authMode==='signup'?'active':''}" data-action="auth-tab" data-mode="signup">Create account</div>
    </div>
    <div class="auth-error ${authError?'show':''}">${escapeHtml(authError)}</div>
    <div class="input-group">
      <label>Email</label>
      <input class="text-input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input class="text-input" id="auth-password" type="password" placeholder="At least 6 characters" autocomplete="${authMode==='signin'?'current-password':'new-password'}">
    </div>
    <button class="primary-btn" data-action="auth-submit" ${authBusy?'disabled':''}>${authBusy?'Please wait…':(authMode==='signin'?'Sign in':'Create account')}</button>
    <div class="auth-hint">Your workouts are private and stored under your account only.</div>
  </div>`;
}

function renderAuthOnly(){
  document.getElementById('app').innerHTML = renderAuthScreen();
  attachAuthHandlers();
}

function attachAuthHandlers(){
  document.querySelectorAll('[data-action="auth-tab"]').forEach(el=>{
    el.addEventListener('click', ()=>{ authMode = el.dataset.mode; authError=''; renderAuthOnly(); });
  });
  const submitBtn = document.querySelector('[data-action="auth-submit"]');
  if(submitBtn) submitBtn.addEventListener('click', handleAuthSubmit);
  const pwInput = document.getElementById('auth-password');
  if(pwInput) pwInput.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAuthSubmit(); });
}

async function handleAuthSubmit(){
  const email = (document.getElementById('auth-email').value||'').trim();
  const password = document.getElementById('auth-password').value||'';
  if(!email || !password){ authError='Please fill in both fields.'; renderAuthOnly(); return; }
  authBusy = true; authError=''; renderAuthOnly();
  try{
    if(authMode==='signin') await auth.signInWithEmailAndPassword(email, password);
    else await auth.createUserWithEmailAndPassword(email, password);
    // onAuthStateChanged handles the rest
  }catch(e){
    authBusy = false;
    authError = friendlyAuthError(e.code);
    renderAuthOnly();
  }
}

/* ===================== INIT ===================== */
(function init(){
  const appEl = document.getElementById('app');
  if(!FIREBASE_SDK_LOADED || !FIREBASE_CONFIGURED){
    renderAuthOnly();
    return;
  }
  appEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-family:'Hind Guntur',sans-serif;">Loading…</div>`;
  auth.onAuthStateChanged(async user=>{
    if(user){
      currentUser = user;
      appEl.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-family:'Hind Guntur',sans-serif;">Loading your data…</div>`;
      await cloudLoadAll();
      state.screen='home';
      render();
    } else {
      currentUser = null;
      renderAuthOnly();
    }
  });
})();
</script>
