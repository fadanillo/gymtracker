<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Progress</title>
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAIAAACyr5FlAAABhWlDQ1BJQ0MgcHJvZmlsZQAAKJF9kT1Iw0AcxV9TpSIVBzuIOGSoThZERRy1CkWoEGqFVh1MLv2CJg1Jiouj" style="display:none">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Progress">
<meta name="theme-color" content="#131319">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Guntur:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-firestore-compat.min.js"></script>
<style>
:root{
  --bg:#131319;--surface:#1c1d25;--surface-2:#252631;--border:#33343f;
  --text:#f2f0ea;--text-dim:#93949f;--text-faint:#5c5d68;
  --accent:#ff5a36;--accent-2:#ffb35a;--success:#4ade80;--danger:#ff6161;
  --radius:16px;--radius-sm:10px;font-size:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Hind Guntur',sans-serif;height:100%;}
body{overscroll-behavior-y:none;}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
.mono{font-family:'JetBrains Mono',monospace;}

/* Header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 80%,transparent);padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.back-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--text);}
.back-btn svg{width:18px;height:18px;}
.header-title{font-family:'Hind Guntur',sans-serif;font-size:1.35rem;font-weight:600;flex:1;letter-spacing:0.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.header-sub{font-size:0.78rem;color:var(--text-dim);font-weight:400;font-family:'Hind Guntur',sans-serif;letter-spacing:0;}
.header-actions{display:flex;gap:8px;align-items:center;}

/* Streak badge */
.streak-badge{width:46px;height:46px;border-radius:50%;flex:none;position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--surface-2);border:1px solid var(--border);}
.streak-count{position:absolute;bottom:-6px;right:-6px;background:var(--accent);color:#fff;font-family:'JetBrains Mono',monospace;font-size:0.62rem;font-weight:700;border-radius:20px;padding:2px 5px;min-width:16px;text-align:center;border:2px solid var(--bg);}

/* Menu button */
.menu-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--text-dim);}
.menu-btn svg{width:18px;height:18px;}

main{flex:1;padding:0 18px 100px;}

/* Intro */
.intro{padding:4px 0 16px;}
.intro h1{font-family:'Hind Guntur',sans-serif;font-size:1.9rem;margin:0 0 4px;font-weight:700;}
.intro p{margin:0;color:var(--text-dim);font-size:0.9rem;}

/* Today card */
.today-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 14px 14px 12px;margin-bottom:18px;}
.today-badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.today-info{flex:1;min-width:0;}
.today-top-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.today-streak{font-size:0.95rem;font-weight:700;white-space:nowrap;}
.today-week-count{font-size:0.72rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace;white-space:nowrap;}
.today-mark-btn{flex:none;width:40px;height:40px;border-radius:12px;border:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.today-mark-btn svg{width:18px;height:18px;}
.today-mark-btn.done{background:var(--success);font-size:1.1rem;font-weight:700;color:#0a0a0a;}
.wp-bar{height:8px;border-radius:5px;background:var(--border);overflow:hidden;margin-top:8px;}
.wp-bar-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .3s ease;}

/* Calendar */
.calendar-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-title{font-weight:600;font-size:1rem;}
.cal-nav{display:flex;gap:6px;}
.cal-nav-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--surface-2);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.cal-nav-btn svg{width:14px;height:14px;stroke:currentColor;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{text-align:center;font-size:0.65rem;font-weight:700;color:var(--text-faint);text-transform:uppercase;padding-bottom:6px;font-family:'JetBrains Mono',monospace;}
.cal-day{aspect-ratio:1/1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative;transition:background .15s;}
.cal-day:hover{background:var(--surface-2);}
.cal-day.other-month{opacity:0.25;}
.cal-day.today .cal-day-num{background:var(--accent);color:#fff;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;}
.cal-day-num{font-size:0.78rem;font-weight:600;line-height:1;}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:28px;}
.cal-dot{width:5px;height:5px;border-radius:50%;flex:none;}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.cal-legend-item{display:flex;align-items:center;gap:5px;font-size:0.72rem;color:var(--text-dim);}
.cal-legend-dot{width:8px;height:8px;border-radius:50%;}

/* Groups grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:120px;transition:transform .15s ease,border-color .15s ease;}
.group-card:active{transform:scale(0.97);}
.group-icon-chip{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;}
.group-icon-chip svg{width:24px;height:24px;}
.group-card .g-name{font-size:1rem;font-weight:600;}
.group-card .g-count{color:var(--text-faint);font-size:0.75rem;font-family:'JetBrains Mono',monospace;margin-top:2px;}

/* Exercise grid */
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;}
.ex-card .ex-photo{flex:1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.ex-card .ex-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.ex-card .ex-photo svg{width:34px;height:34px;stroke:var(--text-faint);}
.ex-card .ex-name{padding:9px 10px;font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--border);}
.add-card{border:1.5px dashed var(--border);border-radius:var(--radius);aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--text-dim);background:transparent;}
.add-card svg{width:26px;height:26px;}
.add-card span{font-size:0.78rem;font-weight:600;}

/* Exercise detail */
.ex-hero{display:flex;gap:14px;align-items:center;margin-bottom:20px;}
.ex-hero-photo{width:84px;height:84px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;}
.ex-hero-photo img{width:100%;height:100%;object-fit:cover;}
.ex-hero-photo svg{width:30px;height:30px;stroke:var(--text-faint);}
.ex-hero-info h2{font-size:1.3rem;margin:0 0 4px;font-weight:600;}
.ex-hero-info .last-log{font-size:0.78rem;color:var(--text-dim);}
.icon-btn-row{display:flex;gap:8px;margin-top:8px;}
.icon-btn{width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.icon-btn svg{width:14px;height:14px;stroke:var(--text-dim);}
.tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;}
.tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:0.85rem;font-weight:600;cursor:pointer;color:var(--text-dim);transition:background .15s ease,color .15s ease;}
.tab.active{background:var(--accent);color:#fff;}
.set-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.set-num{width:26px;height:26px;border-radius:50%;background:var(--surface-2);flex:none;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--text-dim);font-weight:700;}
.set-fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.field{background:var(--surface-2);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;}
.field label{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-faint);font-weight:600;}
.field .stepper{display:flex;align-items:center;gap:6px;}
.field input{background:transparent;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1rem;font-weight:700;width:100%;text-align:center;padding:2px 0;}
.field input:focus{outline:none;}
.stepper button{width:22px;height:22px;border-radius:6px;border:none;background:var(--border);color:var(--text);font-size:1rem;line-height:1;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;}
.stepper button:active{background:var(--accent);}
.primary-btn{width:100%;padding:15px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-family:'Hind Guntur',sans-serif;font-size:1rem;font-weight:600;letter-spacing:0.02em;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;}
.primary-btn:active{background:#e64d2b;}
.primary-btn.secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);}
.primary-btn:disabled{opacity:0.4;}

/* History */
.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.empty-state svg{width:44px;height:44px;stroke:var(--text-faint);margin-bottom:14px;}
.empty-state p{margin:0;font-size:0.9rem;line-height:1.5;}
.chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 10px 8px;margin-bottom:16px;}
.chart-stats{display:flex;gap:10px;padding:0 6px 14px;}
.stat-pill{flex:1;background:var(--surface-2);border-radius:10px;padding:10px 12px;}
.stat-pill .num{font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:700;color:var(--accent-2);}
.stat-pill .lbl{font-size:0.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}
.tooltip{position:absolute;background:var(--surface-2);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;font-size:0.75rem;pointer-events:none;transform:translate(-50%,-115%);white-space:nowrap;z-index:5;}
.tooltip .t-date{color:var(--text-dim);margin-bottom:3px;}
.tooltip .t-sets{font-family:'JetBrains Mono',monospace;font-weight:600;}
.log-list{margin-top:4px;}
.log-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;}
.log-item .l-date{font-size:0.75rem;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.log-item .l-sets{display:flex;flex-wrap:wrap;gap:6px;}
.l-set-chip{background:var(--surface-2);border-radius:7px;padding:4px 9px;font-family:'JetBrains Mono',monospace;font-size:0.78rem;}
.l-set-chip b{color:var(--accent-2);}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,13,0.72);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);}
.modal-overlay.center{align-items:center;padding:20px;}
.modal-sheet{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;}
.modal-overlay.center .modal-sheet{border-radius:20px;max-width:400px;}
@keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 18px;}
.modal-title{font-size:1.2rem;font-weight:600;margin:0 0 18px;}
.input-group{margin-bottom:16px;}
.input-group label{display:block;font-size:0.78rem;color:var(--text-dim);margin-bottom:7px;font-weight:600;}
.text-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;color:var(--text);font-size:0.95rem;font-family:'Hind Guntur',sans-serif;}
.text-input:focus{outline:none;border-color:var(--accent);}
.photo-drop{border:1.5px dashed var(--border);border-radius:14px;padding:20px;text-align:center;cursor:pointer;color:var(--text-dim);font-size:0.85rem;position:relative;overflow:hidden;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.photo-drop svg{width:24px;height:24px;stroke:var(--text-faint);}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-actions .primary-btn{margin-top:0;}

/* Streak modal */
.streak-hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 22px;}
.streak-hero .big-badge{width:110px;height:110px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.streak-hero .streak-num{font-size:1.6rem;font-weight:700;}
.streak-hero .streak-label{color:var(--text-dim);font-size:0.85rem;margin-top:2px;}
.goal-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
.goal-row .g-text{display:flex;flex-direction:column;gap:2px;}
.goal-row .g-title{font-weight:600;font-size:0.9rem;}
.goal-row .g-hint{font-size:0.72rem;color:var(--text-faint);}
.goal-stepper{display:flex;align-items:center;gap:10px;}
.goal-stepper button{width:30px;height:30px;border-radius:9px;border:none;background:var(--border);color:var(--text);font-size:1.1rem;cursor:pointer;}
.goal-stepper .g-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.1rem;min-width:18px;text-align:center;}
.week-progress{background:var(--surface-2);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
.wp-top{display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:8px;}
.wp-top .wp-count{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent-2);}
.week-dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px;}
.week-dot{width:11px;height:11px;border-radius:50%;background:var(--border);}
.week-dot.met{background:var(--accent);}
.info-tip{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:0.78rem;color:var(--text-dim);line-height:1.5;margin-top:6px;}

/* Side drawer */
.drawer-overlay{position:fixed;inset:0;background:rgba(10,10,13,0.6);z-index:200;backdrop-filter:blur(2px);display:none;}
.drawer-overlay.open{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:300px;max-width:85vw;background:var(--surface);border-left:1px solid var(--border);z-index:201;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:0 0 40px;}
.drawer.open{transform:translateX(0);}
.drawer-header{padding:54px 20px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.drawer-header h2{margin:0;font-size:1.1rem;font-weight:700;}
.drawer-close{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:none;color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.drawer-close svg{width:14px;height:14px;stroke:currentColor;}
.drawer-section{padding:18px 20px 0;}
.drawer-section-title{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-faint);font-weight:700;margin-bottom:12px;}
.activity-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.activity-item:last-of-type{border-bottom:none;}
.activity-dot-big{width:16px;height:16px;border-radius:50%;flex:none;}
.activity-name{flex:1;font-size:0.9rem;font-weight:500;}
.activity-delete{width:26px;height:26px;border-radius:7px;border:none;background:transparent;color:var(--text-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.activity-delete svg{width:13px;height:13px;stroke:currentColor;}
.add-activity-row{display:flex;gap:8px;margin-top:14px;align-items:center;}
.color-picker-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.color-swatch{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2.5px solid transparent;transition:border-color .15s;}
.color-swatch.selected{border-color:#fff;}

/* Activity pick modal */
.activity-pick-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.activity-pick-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--surface-2);border-radius:12px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;}
.activity-pick-item.selected{border-color:var(--accent);}
.activity-pick-dot{width:14px;height:14px;border-radius:50%;flex:none;}
.activity-pick-name{font-weight:600;font-size:0.95rem;}

/* Date pick in calendar modal */
.date-input{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;color:var(--text);font-size:0.95rem;font-family:'JetBrains Mono',monospace;}
.date-input:focus{outline:none;border-color:var(--accent);}

/* Flame */
@keyframes flicker{0%,100%{opacity:1;transform:scale(1) translateY(0);}50%{opacity:0.75;transform:scale(1.05) translateY(-1px);}}
.flame-glow{animation:flicker 1.4s ease-in-out infinite;}

::-webkit-scrollbar{width:0;height:0;}

/* Auth */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 26px;max-width:420px;margin:0 auto;}
.auth-logo{width:64px;height:64px;border-radius:20px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;margin-bottom:22px;}
.auth-logo svg{width:32px;height:32px;}
.auth-wrap h1{font-size:1.7rem;font-weight:700;margin:0 0 6px;}
.auth-wrap .auth-sub{color:var(--text-dim);font-size:0.88rem;margin:0 0 26px;line-height:1.5;}
.auth-tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:20px;}
.auth-tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:0.85rem;font-weight:600;cursor:pointer;color:var(--text-dim);}
.auth-tab.active{background:var(--accent);color:#fff;}
.auth-error{background:rgba(255,97,97,0.12);border:1px solid var(--danger);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:0.8rem;margin-bottom:14px;display:none;}
.auth-error.show{display:block;}
.auth-hint{font-size:0.72rem;color:var(--text-faint);margin-top:18px;line-height:1.5;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>

<!-- Drawer -->
<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="side-drawer">
  <div class="drawer-header">
    <h2>Settings</h2>
    <button class="drawer-close" id="drawer-close-btn">

function sundayOf(iso){
  const d=new Date(iso+'T00:00:00');

/* ============================================================
   STREAK LOGIC (тиждень починається з неділі)
   ============================================================ */
function computeStreak(){
  const goal=DB.settings.weeklyGoal;
  const days=[...new Set(DB.trainingDays.map(d=>d.date))].sort();
  if(days.length===0) return {streak:0,thisWeekCount:0,goal,weeks:[],thisWeekMet:false};

  const buckets={};
  days.forEach(d=>{
    const wk=sundayOf(d);
    (buckets[wk]=buckets[wk]||new Set()).add(d);
  });

  const earliestWeek=sundayOf(days[0]);
  const currentWeek=sundayOf(todayISO());

  // Поточний тиждень теж рахується якщо виконано ціль
  let streak=0;
  let cursor=currentWeek;
  while(cursor>=earliestWeek){
    const cnt=buckets[cursor]?buckets[cursor].size:0;
    if(cnt>=Math.max(goal,1)||(goal===0)){
      streak++;
      cursor=addDays(cursor,-7);
    } else break;
  }

  const thisWeekCount=buckets[currentWeek]?buckets[currentWeek].size:0;
  const thisWeekMet=thisWeekCount>=Math.max(goal,1)||(goal===0);

  const weeks=[];
  for(let i=8;i>=1;i--){
    const wk=addDays(currentWeek,-7*i);
    if(wk<earliestWeek){weeks.push(null);continue;}
    const cnt=buckets[wk]?buckets[wk].size:0;
    weeks.push(cnt>=Math.max(goal,1)||(goal===0));
  }

  return {streak,thisWeekCount,goal,weeks,thisWeekMet};
}

function levelFromStreak(streak){ return Math.max(0,Math.min(11,streak)); }

function armBadgeSVG(level,size){
  if(level===0) return chickenFootSVG(size);
  const t=level/11;
  const bulgeRx=9+level*1.9, bulgeRy=7+level*1.35;
  const c1=[232,196,166],c2=[201,124,72],c3=[214,74,46];
  let r,g,b;
  if(t<0.55){const k=t/0.55;r=c1[0]+(c2[0]-c1[0])*k;g=c1[1]+(c2[1]-c1[1])*k;b=c1[2]+(c2[2]-c1[2])*k;}
  else{const k=(t-0.55)/0.45;r=c2[0]+(c3[0]-c2[0])*k;g=c2[1]+(c3[1]-c2[1])*k;b=c2[2]+(c3[2]-c2[2])*k;}
  const skin=`rgb(${r|0},${g|0},${b|0})`;
  const veinOpacity=level>=8?Math.min(1,(level-7)/3.5):0;
  const fireOn=level>=11;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="${fireOn?'flame-glow':''}">
    <line x1="20" y1="83" x2="46" y2="53" stroke="${skin}" stroke-width="24" stroke-linecap="round"/>
    <circle cx="18" cy="85" r="15" fill="${skin}"/>
    <line x1="46" y1="53" x2="70" y2="22" stroke="${skin}" stroke-width="20" stroke-linecap="round"/>
    <circle cx="72" cy="20" r="12" fill="${skin}"/>
    <ellipse cx="49" cy="46" rx="${bulgeRx}" ry="${bulgeRy}" fill="${skin}" transform="rotate(-40 49 46)"/>
    ${veinOpacity>0?`<path d="M38,54 Q47,44 54,32" stroke="rgba(90,40,30,${veinOpacity})" stroke-width="1.6" fill="none"/><path d="M43,58 Q52,47 60,36" stroke="rgba(90,40,30,${veinOpacity*0.8})" stroke-width="1.3" fill="none"/>`:''}
    ${fireOn?`<g opacity="0.92"><path d="M49 20c4 6-2 9-1 14 4-1 7-6 5-11 5 4 7 11 2 16-4 4-11 3-13-2-2-4 0-9 3-11z" fill="#ffb35a"/><path d="M49 26c2 3-1 5-1 7 2-1 4-3 3-6 3 2 3 6 0 8-2 2-6 1-7-1-1-2 0-5 2-7z" fill="#ff5a36"/></g>`:''}
  </svg>`;
}

/* ============================================================
   IMAGE COMPRESSION
   ============================================================ */
function compressImage(dataUrl,maxSize=480,quality=0.72){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      let {width,height}=img;
      if(width>height){if(width>maxSize){height*=maxSize/width;width=maxSize;}}
      else{if(height>maxSize){width*=maxSize/height;height=maxSize;}}
      const canvas=document.createElement('canvas');
      canvas.width=width;canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      resolve(canvas.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>resolve(null);
    img.src=dataUrl;
  });
}

/* ============================================================
   CALENDAR RENDER
   ============================================================ */
const MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function renderCalendar(){
  const today=todayISO();
  const firstDay=new Date(calYear,calMonth,1);
  const startDow=firstDay.getDay(); // 0=Sun
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();

  let cells='';
  // empty cells before month start
  for(let i=0;i<startDow;i++){
    const prevDate=new Date(calYear,calMonth,1-startDow+i);
    const iso=prevDate.toISOString().slice(0,10);
    cells+=calDayCell(iso,prevDate.getDate(),true,today);
  }
  for(let d=1;d<=daysInMonth;d++){
    const iso=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells+=calDayCell(iso,d,false,today);
  }
  // fill remaining to complete row
  const total=startDow+daysInMonth;
  const remainder=(7-total%7)%7;
  for(let i=1;i<=remainder;i++){
    const nextDate=new Date(calYear,calMonth+1,i);
    const iso=nextDate.toISOString().slice(0,10);
    cells+=calDayCell(iso,nextDate.getDate(),true,today);
  }

  const dowHeaders=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');

  // legend
  const usedIds=new Set(DB.trainingDays.map(d=>d.activityId));
  const legendItems=DB.activities.filter(a=>usedIds.has(a.id)).map(a=>
    `<div class="cal-legend-item"><div class="cal-legend-dot" style="background:${a.color}"></div>${escapeHtml(a.name)}</div>`
  ).join('');

  return `
  <div class="calendar-wrap">
    <div class="cal-header">
      <div class="cal-title">${MONTH_NAMES[calMonth]} ${calYear}</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" data-action="cal-prev">${ICONS.chevLeft}</button>
        <button class="cal-nav-btn" data-action="cal-next">${ICONS.chevRight}</button>
      </div>
    </div>
    <div class="cal-grid">
      ${dowHeaders}
      ${cells}
    </div>
    ${legendItems?`<div class="cal-legend">${legendItems}</div>`:''}
  </div>`;
}

function calDayCell(iso,dayNum,otherMonth,today){
  const entries=daysOnDate(iso);
  const isToday=iso===today;
  const isFuture=iso>today;
  const dots=entries.map(e=>{
    const act=activityById(e.activityId)||{color:'#ff5a36'};
    return `<div class="cal-dot" style="background:${act.color}"></div>`;
  }).join('');

  return `<div class="cal-day${otherMonth?' other-month':''}${isToday?' today':''}" data-action="${isFuture?'':'cal-day-tap'}" data-date="${iso}">
    <div class="cal-day-num">${dayNum}</div>
    ${dots?`<div class="cal-dots">${dots}</div>`:''}
  </div>`;
}

function renderLogTab(ex){
  const todayEntry=(DB.logs[ex.id]||[]).find(l=>l.date===todayISO());
  const existingSets=todayEntry?todayEntry.sets:[];
  window.__draftSets=window.__draftSets||{};
  if(!window.__draftSets[ex.id]){
    const rows=[0,1,2,3,4].map(i=>existingSets[i]?{reps:existingSets[i].reps,weight:existingSets[i].weight}:{reps:'',weight:''});
    window.__draftSets[ex.id]=rows;
  }
  const draft=window.__draftSets[ex.id];
  return `<div>
    ${draft.map((row,i)=>`
      <div class="set-row">
        <div class="set-num">${i+1}</div>
        <div class="set-fields">
          <div class="field">
            <label>Reps</label>
            <div class="stepper">
              <button data-action="step-reps" data-i="${i}" data-d="-1">−</button>
              <input type="number" inputmode="numeric" min="0" data-role="reps" data-i="${i}" value="${row.reps}" placeholder="0">
              <button data-action="step-reps" data-i="${i}" data-d="1">+</button>
            </div>
          </div>
          <div class="field">
            <label>Weight, kg</label>
            <div class="stepper">
              <button data-action="step-weight" data-i="${i}" data-d="-2.5">−</button>
              <input type="number" inputmode="decimal" min="0" step="0.5" data-role="weight" data-i="${i}" value="${row.weight}" placeholder="0">
              <button data-action="step-weight" data-i="${i}" data-d="2.5">+</button>
            </div>
          </div>
        </div>
      </div>
    `).join('')}
    <button class="primary-btn" data-action="save-log">Save workout</button>
  </div>`;
}

function renderHistoryTab(ex,logs){
  if(logs.length===0) return `<div class="empty-state">${ICONS.chartBig}<p>No data yet.<br>Log your first workout!</p></div>`;
  const asc=logs.slice().reverse();
  const points=asc.map(l=>({date:l.date,top:Math.max(...l.sets.map(s=>Number(s.weight)||0)),sets:l.sets}));
  const maxW=Math.max(...points.map(p=>p.top)),minW=Math.min(...points.map(p=>p.top));
  const padding=Math.max(5,Math.round((maxW*0.3)/2.5)*2.5);
  let yMax=Math.ceil((maxW+padding)/5)*5,yMin=Math.max(0,Math.floor((minW-padding)/5)*5);
  if(yMax===yMin) yMax=yMin+10;
  const W=480,H=200,padL=36,padR=12,padT=14,padB=26;
  const plotW=W-padL-padR,plotH=H-padT-padB;
  const xStep=points.length>1?plotW/(points.length-1):0;
  const xOf=i=>padL+(points.length>1?i*xStep:plotW/2);
  const yOf=v=>padT+plotH-((v-yMin)/(yMax-yMin))*plotH;
  const linePath=points.map((p,i)=>`${i===0?'M':'L'}${xOf(i).toFixed(1)},${yOf(p.top).toFixed(1)}`).join(' ');
  const areaPath=`${linePath} L${xOf(points.length-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${xOf(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;
  const gridLines=[];
  for(let i=0;i<=4;i++){
    const val=yMin+(yMax-yMin)*i/4,y=yOf(val);
    gridLines.push(`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`);
    gridLines.push(`<text x="4" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--text-faint)" font-family="JetBrains Mono">${Math.round(val)}</text>`);
  }
  const dateLabels=points.map((p,i)=>{
    if(points.length>6&&i%Math.ceil(points.length/6)!==0&&i!==points.length-1) return '';
    return `<text x="${xOf(i).toFixed(1)}" y="${H-6}" font-size="9" fill="var(--text-faint)" font-family="JetBrains Mono" text-anchor="middle">${fmtDate(p.date)}</text>`;
  }).join('');
  const dots=points.map((p,i)=>`<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.top).toFixed(1)}" r="4" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5" data-action="chart-point" data-idx="${i}" style="cursor:pointer"/>`).join('');
  const best=Math.max(...points.map(p=>p.top));
  const lastEntry=points[points.length-1];
  return `
    <div class="chart-stats">
      <div class="stat-pill"><div class="num">${best}<span style="font-size:0.6em">kg</span></div><div class="lbl">Best</div></div>
      <div class="stat-pill"><div class="num">${lastEntry.top}<span style="font-size:0.6em">kg</span></div><div class="lbl">Last</div></div>
      <div class="stat-pill"><div class="num">${points.length}</div><div class="lbl">Workouts</div></div>
    </div>
    <div class="chart-wrap" style="position:relative;">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;">
        <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
        ${gridLines.join('')}
        <path d="${areaPath}" fill="url(#areaGrad)"/>
        <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}${dateLabels}
      </svg>
      <div id="chart-tooltip"></div>
    </div>
    <div class="log-list">
      ${asc.slice().reverse().map(l=>`
        <div class="log-item">
          <div class="l-date">${fmtDate(l.date)}</div>
          <div class="l-sets">${l.sets.map((s,i)=>`<span class="l-set-chip">Set ${i+1}: <b>${s.reps}</b>×<b>${s.weight}</b>kg</span>`).join('')}</div>
        </div>
      `).join('')}
    </div>`;
}

function renderDrawerContents(){

  if(listEl){
    listEl.innerHTML=DB.activities.map(a=>`
      <div class="activity-item">
        <div class="activity-dot-big" style="background:${a.color}"></div>

    listEl.querySelectorAll('[data-action="delete-activity"]').forEach(el=>{

  // Color picker

  if(cpRow){
    cpRow.innerHTML=ACTIVITY_COLORS.map(c=>`

  if(addBtn){

/* ============================================================
   EVENT HANDLERS
   ============================================================ */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click',onAction);
  });
  const nameInput=document.getElementById('ex-name-input');
  if(nameInput) nameInput.oninput=e=>{modal.name=e.target.value;};
  document.querySelectorAll('input[data-role]').forEach(inp=>{
    inp.addEventListener('input',e=>{
      const i=+e.target.dataset.i, role=e.target.dataset.role;
      const ex=getExercise(state.exerciseId).ex;
      window.__draftSets[ex.id][i][role]=e.target.value;
    });
  });
  const photoInput=document.getElementById('photo-input');
  if(photoInput){
    photoInput.addEventListener('change',async e=>{
      const file=e.target.files[0];
      if(!file) return;
      const reader=new FileReader();
      reader.onload=async ev=>{
        const compressed=await compressImage(ev.target.result);
        pendingPhoto=compressed;
        render();
      };
      reader.readAsDataURL(file);
    });
  }
}

async function onAction(e){
  e.stopPropagation();
  const el=e.currentTarget;
  const action=el.dataset.action;

  // Navigation
  if(action==='open-group'){state.groupId=el.dataset.id;state.screen='group';render();}
  else if(action==='open-exercise'){state.exerciseId=el.dataset.id;state.exTab='log';delete window.__draftSets?.[el.dataset.id];state.screen='exercise';render();}
  else if(action==='back'){
    if(state.screen==='exercise') state.screen='group';
    else if(state.screen==='group') state.screen='home';
    render();
  }
  else if(action==='ex-tab'){state.exTab=el.dataset.tab;render();}

  // Drawer
  else if(action==='open-drawer') openDrawer();

  // Calendar nav
  else if(action==='cal-prev'){calMonth--;if(calMonth<0){calMonth=11;calYear--;}render();}
  else if(action==='cal-next'){calMonth++;if(calMonth>11){calMonth=0;calYear++;}render();}
  else if(action==='cal-day-tap'){
    const date=el.dataset.date;
    if(!date||date>todayISO()) return;
    modal={type:'pick-activity-day',date};
    render();
  }

  // Exercises
  else if(action==='add-exercise'){modal={type:'add-exercise',name:''};pendingPhoto=null;render();}
  else if(action==='edit-exercise'){modal={type:'edit-exercise'};pendingPhoto=null;render();}
  else if(action==='delete-exercise'){
    const found=getExercise(state.exerciseId);
    if(found&&confirm(`Delete "${found.ex.name}"?`)){
      DB.exercises[found.groupId]=DB.exercises[found.groupId].filter(x=>x.id!==state.exerciseId);
      delete DB.logs[state.exerciseId];
      cloudDeleteExercise(state.exerciseId);
      state.screen='group';render();
    }
  }
  else if(action==='pick-photo'){document.getElementById('photo-input').click();}
  else if(action==='close-modal'||action==='close-modal-bg'){
    if(action==='close-modal-bg'&&el!==e.target) return;
    modal=null;pendingPhoto=null;render();
  }
  else if(action==='save-new-exercise'){
    const name=(modal.name||'').trim();
    if(!name){shake('ex-name-input');return;}
    const newEx={id:uid(),name,photo:pendingPhoto||null};
    DB.exercises[state.groupId].push(newEx);
    cloudSaveExercise(newEx,state.groupId);
    modal=null;pendingPhoto=null;render();
  }
  else if(action==='save-edit-exercise'){
    const nameInput=document.getElementById('ex-name-input');
    const name=(nameInput.value||'').trim();
    if(!name){shake('ex-name-input');return;}
    const found=getExercise(state.exerciseId);
    found.ex.name=name;
    if(pendingPhoto!==null) found.ex.photo=pendingPhoto;
    cloudSaveExercise(found.ex,found.groupId);
    modal=null;pendingPhoto=null;render();
  }

  // Steppers
  else if(action==='step-reps'||action==='step-weight'){
    const i=+el.dataset.i, d=parseFloat(el.dataset.d);
    const ex=getExercise(state.exerciseId).ex;
    const role=action==='step-reps'?'reps':'weight';
    const cur=parseFloat(window.__draftSets[ex.id][i][role])||0;
    let next=cur+d;
    if(next<0) next=0;
    window.__draftSets[ex.id][i][role]=role==='weight'?(Math.round(next*2)/2):Math.round(next);
    render();
  }
  else if(action==='save-log'){
    const ex=getExercise(state.exerciseId).ex;
    const draft=window.__draftSets[ex.id];
    const validSets=draft.map(r=>({reps:parseFloat(r.reps)||0,weight:parseFloat(r.weight)||0})).filter(r=>r.reps>0);
    if(validSets.length===0){alert('Fill in at least one set (reps).');return;}
    const today=todayISO();
    const existingIdx=(DB.logs[ex.id]||[]).findIndex(l=>l.date===today);
    if(!DB.logs[ex.id]) DB.logs[ex.id]=[];
    if(existingIdx>=0) DB.logs[ex.id][existingIdx]={date:today,sets:validSets};
    else DB.logs[ex.id].push({date:today,sets:validSets});
    // mark today with Gym activity if not already marked
    if(!hasTrainedOn(today)){
      // show activity picker
      modal={type:'pick-activity',date:today,_afterSave:true};
    } else {
      delete window.__draftSets[ex.id];
      state.exTab='history';
    }
    const found=getExercise(ex.id);
    cloudSaveExercise(ex,found.groupId);
    cloudSaveMeta();
    render();
  }

  // Streak / mark today
  else if(action==='open-streak'){modal={type:'streak'};render();}
  else if(action==='mark-today'){
    const today=todayISO();
    modal={type:'pick-activity',date:today};
    render();
  }

  // Activity pick
  else if(action==='confirm-activity'){
    const date=el.dataset.date;
    const actId=el.dataset.activity;
    // If already exists for same activity on same date, skip
    const already=DB.trainingDays.some(d=>d.date===date&&d.activityId===actId);
    if(!already){
      DB.trainingDays.push({date,activityId:actId});
      cloudSaveMeta();
    }
    // If came from save-log flow
    if(modal._afterSave){
      const ex=getExercise(state.exerciseId)?.ex;
      if(ex) delete window.__draftSets[ex.id];
      state.exTab='history';
      modal=null;
      render();
    } else {
      modal={type:'pick-activity-day',date};
      render();
    }
  }
  else if(action==='remove-day-entry'){
    const date=el.dataset.date;
    const actId=el.dataset.activity;
    DB.trainingDays=DB.trainingDays.filter(d=>!(d.date===date&&d.activityId===actId));
    cloudSaveMeta();
    modal={type:'pick-activity-day',date};
    render();
  }

  // Goal
  else if(action==='goal-step'){
    const d=parseInt(el.dataset.d);
    DB.settings.weeklyGoal=Math.max(0,Math.min(7,DB.settings.weeklyGoal+d));
    cloudSaveMeta();
    render();
  }
  else if(action==='sign-out'){
    if(confirm('Sign out?')) auth.signOut();
  }
}

function shake(id){
  const el=document.getElementById(id);
  if(!el) return;
  el.style.borderColor='var(--danger)';
  setTimeout(()=>{el.style.borderColor='var(--border)';},700);
}

/* Chart tooltip */
document.addEventListener('click',e=>{
  const pt=e.target.closest('[data-action="chart-point"]');
  const tipHost=document.getElementById('chart-tooltip');
  if(!pt){if(tipHost) tipHost.innerHTML='';return;}
  e.stopPropagation();
  const idx=+pt.dataset.idx;
  const found=getExercise(state.exerciseId);
  if(!found) return;
  const logs=(DB.logs[found.ex.id]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const entry=logs[idx];
  if(!entry||!tipHost) return;
  const cx=pt.getAttribute('cx'),cy=pt.getAttribute('cy');
  const svg=pt.closest('svg');
  const rect=svg.getBoundingClientRect();
  const vb=svg.viewBox.baseVal;
  const px=rect.left+(cx/vb.width)*rect.width;
  const py=rect.top+(cy/vb.height)*rect.height;
  const wrapRect=tipHost.parentElement.getBoundingClientRect();
  tipHost.innerHTML=`<div class="tooltip" style="left:${px-wrapRect.left}px;top:${py-wrapRect.top}px;">
    <div class="t-date">${fmtDate(entry.date)}</div>
    <div class="t-sets">${entry.sets.map(s=>`${s.reps}×${s.weight}kg`).join(' · ')}</div>
  </div>`;
});

/* ============================================================
   AUTH
   ============================================================ */
let authMode='signin',authError='',authBusy=false;

function friendlyAuthError(code){
  const map={'auth/invalid-email':'That email address looks invalid.','auth/user-not-found':'No account found.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Incorrect email or password.','auth/email-already-in-use':'An account with that email already exists.','auth/weak-password':'Password should be at least 6 characters.','auth/too-many-requests':'Too many attempts. Try again in a bit.','auth/network-request-failed':'Network error.'};
  return map[code]||'Something went wrong. Please try again.';
}

function renderAuthScreen(){
  if(!FIREBASE_SDK_LOADED) return `<div class="auth-wrap"><div class="auth-logo">${ICONS.dumbbell}</div><h1>Connection problem</h1><p class="auth-sub">Firebase library couldn't load. Check your internet.</p><button class="primary-btn" onclick="location.reload()">Reload</button></div>`;
  if(!FIREBASE_CONFIGURED) return `<div class="auth-wrap"><div class="auth-logo">${ICONS.dumbbell}</div><h1>Almost there</h1><p class="auth-sub">Add your Firebase config to sync across devices.</p></div>`;
  return `
  <div class="auth-wrap">
    <div class="auth-logo">${ICONS.dumbbell}</div>
    <h1>Your Gym</h1>
    <p class="auth-sub">Sign in to sync your progress across all your devices.</p>
    <div class="auth-tabs">
      <div class="auth-tab ${authMode==='signin'?'active':''}" data-action="auth-tab" data-mode="signin">Sign in</div>
      <div class="auth-tab ${authMode==='signup'?'active':''}" data-action="auth-tab" data-mode="signup">Create account</div>
    </div>
    <div class="auth-error ${authError?'show':''}">${escapeHtml(authError)}</div>
    <div class="input-group"><label>Email</label><input class="text-input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="input-group"><label>Password</label><input class="text-input" id="auth-password" type="password" placeholder="At least 6 characters" autocomplete="${authMode==='signin'?'current-password':'new-password'}"></div>
    <button class="primary-btn" data-action="auth-submit" ${authBusy?'disabled':''}>${authBusy?'Please wait…':(authMode==='signin'?'Sign in':'Create account')}</button>
    <div class="auth-hint">Your workouts are private and stored under your account only.</div>
  </div>`;
}

function renderAuthOnly(){
  document.getElementById('app').innerHTML=renderAuthScreen();
  attachAuthHandlers();
}

function attachAuthHandlers(){
  document.querySelectorAll('[data-action="auth-tab"]').forEach(el=>{
    el.addEventListener('click',()=>{authMode=el.dataset.mode;authError='';renderAuthOnly();});
  });
  const sub=document.querySelector('[data-action="auth-submit"]');
  if(sub) sub.addEventListener('click',handleAuthSubmit);
  const pw=document.getElementById('auth-password');
  if(pw) pw.addEventListener('keydown',e=>{if(e.key==='Enter') handleAuthSubmit();});
}

async function handleAuthSubmit(){
  const email=(document.getElementById('auth-email').value||'').trim();
  const password=document.getElementById('auth-password').value||'';
  if(!email||!password){authError='Please fill in both fields.';renderAuthOnly();return;}
  authBusy=true;authError='';renderAuthOnly();
  try{
    if(authMode==='signin') await auth.signInWithEmailAndPassword(email,password);
    else await auth.createUserWithEmailAndPassword(email,password);
  }catch(e){
    authBusy=false;authError=friendlyAuthError(e.code);renderAuthOnly();
  }
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  const appEl=document.getElementById('app');
  if(!FIREBASE_SDK_LOADED||!FIREBASE_CONFIGURED){renderAuthOnly();return;}
  appEl.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-family:'Hind Guntur',sans-serif;">Loading…</div>`;
  auth.onAuthStateChanged(async user=>{
    if(user){
      currentUser=user;
      appEl.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-family:'Hind Guntur',sans-serif;">Loading your data…</div>`;
      await cloudLoadAll();
      state.screen='home';
      render();
    } else {
      currentUser=null;
      renderAuthOnly();
    }
  });
})();
</script>
