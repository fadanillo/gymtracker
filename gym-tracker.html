<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Прогрес</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131319;
    --surface:#1c1d25;
    --surface-2:#252631;
    --border:#33343f;
    --text:#f2f0ea;
    --text-dim:#93949f;
    --text-faint:#5c5d68;
    --accent:#ff5a36;
    --accent-2:#ffb35a;
    --success:#4ade80;
    --danger:#ff6161;
    --radius:16px;
    --radius-sm:10px;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;height:100%;}
  body{overscroll-behavior-y:none;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}

  .h-title{font-family:'Unbounded',sans-serif;font-weight:600;letter-spacing:0.02em;}
  .mono{font-family:'JetBrains Mono',monospace;}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--bg) 80%, transparent);
    padding:18px 18px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .back-btn{
    width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--text);
  }
  .back-btn svg{width:18px;height:18px;}
  .header-title{font-family:'Unbounded',sans-serif;font-size:1.35rem;font-weight:600;flex:1;letter-spacing:0.01em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .header-sub{font-size:0.78rem;color:var(--text-dim);font-weight:400;font-family:'Manrope',sans-serif;letter-spacing:0;}

  /* ---------- Streak badge ---------- */
  .streak-badge{
    width:46px;height:46px;border-radius:50%;flex:none;position:relative;cursor:pointer;
    display:flex;align-items:center;justify-content:center;background:var(--surface-2);
    border:1px solid var(--border);transition:box-shadow .3s ease;
  }
  .streak-badge svg, .streak-badge .emoji{width:28px;height:28px;}
  .streak-badge .emoji{font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .streak-count{
    position:absolute;bottom:-6px;right:-6px;background:var(--accent);color:#fff;font-family:'JetBrains Mono',monospace;
    font-size:0.62rem;font-weight:700;border-radius:20px;padding:2px 5px;min-width:16px;text-align:center;
    border:2px solid var(--bg);
  }

  main{flex:1;padding:0 18px 100px;}

  /* ---------- Group grid (home) ---------- */
  .intro{padding:4px 0 20px;}
  .intro h1{font-family:'Unbounded',sans-serif;font-size:1.9rem;margin:0 0 4px;font-weight:700;}
  .intro p{margin:0;color:var(--text-dim);font-size:0.9rem;}

  .today-card{
    display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px 14px 14px 12px;margin-bottom:18px;
  }
  .today-badge{flex:none;width:52px;height:52px;border-radius:50%;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .today-info{flex:1;min-width:0;}
  .today-top-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .today-streak{font-family:'Unbounded',sans-serif;font-size:0.95rem;font-weight:700;white-space:nowrap;}
  .today-week-count{font-size:0.72rem;color:var(--text-dim);font-family:'JetBrains Mono',monospace;white-space:nowrap;}
  .today-mark-btn{
    flex:none;width:40px;height:40px;border-radius:12px;border:none;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .today-mark-btn svg{width:18px;height:18px;}
  .today-mark-btn.done{background:var(--success);font-size:1.1rem;font-weight:700;color:#0a0a0a;}

  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .group-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 16px;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-height:120px;
    transition:transform .15s ease, border-color .15s ease;
  }
  .group-card:active{transform:scale(0.97);}
  .group-icon-chip{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;}
  .group-icon-chip svg{width:24px;height:24px;}
  .group-card .g-name{font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:600;}
  .group-card .g-count{color:var(--text-faint);font-size:0.75rem;font-family:'JetBrains Mono',monospace;margin-top:2px;}

  /* ---------- Exercise grid ---------- */
  .ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .ex-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
    cursor:pointer;position:relative;aspect-ratio:1/1;display:flex;flex-direction:column;
  }
  .ex-card .ex-photo{flex:1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .ex-card .ex-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .ex-card .ex-photo svg{width:34px;height:34px;stroke:var(--text-faint);}
  .ex-card .ex-name{padding:9px 10px;font-size:0.85rem;font-weight:600;font-family:'Manrope',sans-serif;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--border);}

  .add-card{
    border:1.5px dashed var(--border);border-radius:var(--radius);aspect-ratio:1/1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;
    color:var(--text-dim);background:transparent;transition:border-color .15s ease,color .15s ease;
  }
  .add-card:active{border-color:var(--accent);color:var(--accent);}
  .add-card svg{width:26px;height:26px;}
  .add-card span{font-size:0.78rem;font-weight:600;}

  /* ---------- Exercise detail ---------- */
  .ex-hero{display:flex;gap:14px;align-items:center;margin-bottom:20px;}
  .ex-hero-photo{width:84px;height:84px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);
    overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;}
  .ex-hero-photo img{width:100%;height:100%;object-fit:cover;}
  .ex-hero-photo svg{width:30px;height:30px;stroke:var(--text-faint);}
  .ex-hero-info h2{font-family:'Unbounded',sans-serif;font-size:1.3rem;margin:0 0 4px;font-weight:600;}
  .ex-hero-info .last-log{font-size:0.78rem;color:var(--text-dim);}
  .icon-btn-row{display:flex;gap:8px;margin-top:8px;}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;background:var(--surface);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .icon-btn svg{width:14px;height:14px;stroke:var(--text-dim);}

  .tabs{display:flex;gap:6px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);
    border-radius:12px;padding:4px;}
  .tab{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:0.85rem;font-weight:600;cursor:pointer;
    color:var(--text-dim);transition:background .15s ease,color .15s ease;}
  .tab.active{background:var(--accent);color:#fff;}

  .set-row{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;
  }
  .set-num{width:26px;height:26px;border-radius:50%;background:var(--surface-2);flex:none;
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
    font-size:0.75rem;color:var(--text-dim);font-weight:700;}
  .set-fields{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .field{background:var(--surface-2);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px;}
  .field label{font-size:0.62rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-faint);font-weight:600;}
  .field .stepper{display:flex;align-items:center;gap:6px;}
  .field input{
    background:transparent;border:none;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:1rem;
    font-weight:700;width:100%;text-align:center;padding:2px 0;
  }
  .field input:focus{outline:none;}
  .stepper button{
    width:22px;height:22px;border-radius:6px;border:none;background:var(--border);color:var(--text);
    font-size:1rem;line-height:1;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center;
  }
  .stepper button:active{background:var(--accent);}

  .primary-btn{
    width:100%;padding:15px;border-radius:14px;border:none;background:var(--accent);color:#fff;
    font-family:'Unbounded',sans-serif;font-size:1rem;font-weight:600;letter-spacing:0.02em;cursor:pointer;
    margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .primary-btn:active{background:#e64d2b;}
  .primary-btn.secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);}
  .primary-btn:disabled{opacity:0.4;}

  /* ---------- History / chart ---------- */
  .empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
  .empty-state svg{width:44px;height:44px;stroke:var(--text-faint);margin-bottom:14px;}
  .empty-state p{margin:0;font-size:0.9rem;line-height:1.5;}

  .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 10px 8px;margin-bottom:16px;}
  .chart-stats{display:flex;gap:10px;padding:0 6px 14px;}
  .stat-pill{flex:1;background:var(--surface-2);border-radius:10px;padding:10px 12px;}
  .stat-pill .num{font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:700;color:var(--accent-2);}
  .stat-pill .lbl{font-size:0.68rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}

  .tooltip{
    position:absolute;background:var(--surface-2);border:1px solid var(--accent);border-radius:10px;padding:8px 10px;
    font-size:0.75rem;pointer-events:none;transform:translate(-50%,-115%);white-space:nowrap;z-index:5;
  }
  .tooltip .t-date{color:var(--text-dim);margin-bottom:3px;}
  .tooltip .t-sets{font-family:'JetBrains Mono',monospace;font-weight:600;}

  .log-list{margin-top:4px;}
  .log-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;}
  .log-item .l-date{font-size:0.75rem;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .log-item .l-sets{display:flex;flex-wrap:wrap;gap:6px;}
  .l-set-chip{background:var(--surface-2);border-radius:7px;padding:4px 9px;font-family:'JetBrains Mono',monospace;font-size:0.78rem;}
  .l-set-chip b{color:var(--accent-2);}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(10,10,13,0.72);z-index:100;display:flex;align-items:flex-end;
    justify-content:center;backdrop-filter:blur(2px);
  }
  .modal-overlay.center{align-items:center;padding:20px;}
  .modal-sheet{
    background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;
  }
  .modal-overlay.center .modal-sheet{border-radius:20px;max-width:400px;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 18px;}
  .modal-title{font-family:'Unbounded',sans-serif;font-size:1.2rem;font-weight:600;margin:0 0 18px;}
  .input-group{margin-bottom:16px;}
  .input-group label{display:block;font-size:0.78rem;color:var(--text-dim);margin-bottom:7px;font-weight:600;}
  .text-input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;
    color:var(--text);font-size:0.95rem;font-family:'Manrope',sans-serif;
  }
  .text-input:focus{outline:none;border-color:var(--accent);}
  .photo-drop{
    border:1.5px dashed var(--border);border-radius:14px;padding:20px;text-align:center;cursor:pointer;
    color:var(--text-dim);font-size:0.85rem;position:relative;overflow:hidden;min-height:110px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  }
  .photo-drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .photo-drop svg{width:24px;height:24px;stroke:var(--text-faint);}
  .modal-actions{display:flex;gap:10px;margin-top:6px;}
  .modal-actions .primary-btn{margin-top:0;}
  .close-x{position:absolute;top:18px;right:18px;width:32px;height:32px;border-radius:50%;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim);}
  .close-x svg{width:14px;height:14px;}

  /* ---------- Streak modal specifics ---------- */
  .streak-hero{display:flex;flex-direction:column;align-items:center;padding:6px 0 22px;}
  .streak-hero .big-badge{width:110px;height:110px;border-radius:50%;background:var(--surface-2);
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;transition:box-shadow .4s ease;}
  .streak-hero .big-badge svg{width:64px;height:64px;}
  .streak-hero .big-badge .emoji{font-size:56px;}
  .streak-hero .streak-num{font-family:'Unbounded',sans-serif;font-size:1.6rem;font-weight:700;}
  .streak-hero .streak-label{color:var(--text-dim);font-size:0.85rem;margin-top:2px;}

  .goal-row{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);
    border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .goal-row .g-text{display:flex;flex-direction:column;gap:2px;}
  .goal-row .g-title{font-weight:600;font-size:0.9rem;display:flex;align-items:center;gap:6px;}
  .goal-row .g-hint{font-size:0.72rem;color:var(--text-faint);}
  .goal-stepper{display:flex;align-items:center;gap:10px;}
  .goal-stepper button{width:30px;height:30px;border-radius:9px;border:none;background:var(--border);color:var(--text);
    font-size:1.1rem;cursor:pointer;}
  .goal-stepper .g-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:1.1rem;min-width:18px;text-align:center;}

  .week-progress{background:var(--surface-2);border-radius:14px;padding:14px 16px;margin-bottom:14px;}
  .wp-top{display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:8px;}
  .wp-top .wp-count{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent-2);}
  .wp-bar{height:8px;border-radius:5px;background:var(--border);overflow:hidden;}
  .wp-bar-fill{height:100%;background:var(--accent);border-radius:5px;transition:width .3s ease;}

  .week-dots{display:flex;gap:6px;justify-content:center;margin-bottom:20px;}
  .week-dot{width:11px;height:11px;border-radius:50%;background:var(--border);}
  .week-dot.met{background:var(--accent);}
  .week-dot.partial{background:var(--accent-2);}

  .info-tip{background:var(--surface-2);border-radius:12px;padding:12px 14px;font-size:0.78rem;color:var(--text-dim);
    line-height:1.5;margin-top:6px;}

  /* flame flicker */
  @keyframes flicker{
    0%,100%{opacity:1;transform:scale(1) translateY(0);}
    50%{opacity:0.75;transform:scale(1.05) translateY(-1px);}
  }
  .flame-glow{animation:flicker 1.4s ease-in-out infinite;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== DATA / CONSTANTS ===================== */
const GROUPS = [
  {id:'chest', name:'Груди', color:'#ff5a36', icon:`<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 10v28"/><path d="M23 12c-2-4-8-6-13-3-5 3-6 10-2 15 3 4 9 7 14 8 1-6 1-14 1-20z"/><path d="M25 12c2-4 8-6 13-3 5 3 6 10 2 15-3 4-9 7-14 8-1-6-1-14-1-20z"/></svg>`},
  {id:'back', name:'Спина', color:'#4aa8ff', icon:`<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8v32"/><path d="M24 10c-6 2-16 2-19 8 4 2 9 1 13-1-3 6-9 9-10 15 6 0 12-4 16-10"/><path d="M24 10c6 2 16 2 19 8-4 2-9 1-13-1 3 6 9 9 10 15-6 0-12-4-16-10"/></svg>`},
  {id:'shoulders', name:'Плечі', color:'#ffb35a', icon:`<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="18" r="7"/><circle cx="36" cy="18" r="7"/><path d="M5 34c2-6 5-9 7-9M43 34c-2-6-5-9-7-9M19 18h10"/></svg>`},
  {id:'arms', name:'Руки', color:'#4ade80', icon:`<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 40 24 26"/><circle cx="8" cy="42" r="5"/><path d="M24 26c-4-2-6-8-2-13 3-4 9-4 12-1 4 4 2 10-2 13" fill="none"/><circle cx="38" cy="10" r="6"/></svg>`},
  {id:'legs', name:'Ноги', color:'#c084fc', icon:`<svg viewBox="0 0 48 48" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="6" width="8" height="24" rx="3"/><rect x="26" y="6" width="8" height="24" rx="3"/><path d="M14 26v6c0 2-1 3-3 4h9v-8M34 26v6c0 2 1 3 3 4h-9v-8"/></svg>`},
];

const ICONS = {
  back:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`,
  plus:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`,
  photo:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-4 4-3-3-6 6"/></svg>`,
  edit:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>`,
  trash:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>`,
  x:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>`,
  chart:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9M10 21V3M17 21v-7"/></svg>`,
  chartBig:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 42V18M18 42V6M30 42v-22M42 42v-14"/></svg>`,
};

const STAGE_LABELS = ["Курча ще спить","Перший підхід","Розігрів","Набираєш форму","Стабільний ритм",
  "Впевнена рука","Сила росте","З'являється рельєф","Накачана рука","Вени видно","Вибухова сила","У вогні!"];

/* ===================== STORAGE ===================== */
const DEFAULTS = {
  exercises: {chest:[], back:[], shoulders:[], arms:[], legs:[]},
  logs: {},
  trainingDays: [],
  settings: {weeklyGoal:4}
};
let DB = JSON.parse(JSON.stringify(DEFAULTS));

async function loadKey(key, fallback){
  try{
    const r = await window.storage.get(key, false);
    if(r && r.value) return JSON.parse(r.value);
    return fallback;
  }catch(e){ return fallback; }
}
async function saveKey(key, value, attempt=1){
  try{
    const res = await window.storage.set(key, JSON.stringify(value), false);
    if(!res) throw new Error('empty response');
    return true;
  }catch(e){
    if(attempt<3){
      await new Promise(r=>setTimeout(r, 400*attempt));
      return saveKey(key, value, attempt+1);
    }
    console.error('storage save failed', key, e);
    showToast('Не вдалося зберегти дані. Перевір з\'єднання.');
    return false;
  }
}
async function loadAll(){
  const [ex, wd, st] = await Promise.all([
    loadKey('exercises-by-group', DEFAULTS.exercises),

function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('uk-UA', {day:'2-digit', month:'short'});
}
function mondayOf(iso){
  const d = new Date(iso+'T00:00:00');
  const day = (d.getDay()+6)%7; // Mon=0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function addDays(iso, n){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ===================== STREAK LOGIC ===================== */
function computeStreak(){
  const goal = DB.settings.weeklyGoal;
  const days = [...new Set(DB.trainingDays)].sort();
  if(days.length===0) return {streak:0, thisWeekCount:0, goal, weeks:[], thisWeekMet:false};

  // bucket by week
  const buckets = {};
  days.forEach(d=>{
    const wk = mondayOf(d);
    (buckets[wk] = buckets[wk]||new Set()).add(d);
  });

  const earliestWeek = mondayOf(days[0]);
  const currentWeek = mondayOf(todayISO());

  // walk backward from week before current
  let streak = 0;
  let cursor = addDays(currentWeek, -7);
  while(cursor >= earliestWeek){
    const cnt = buckets[cursor] ? buckets[cursor].size : 0;
    if(cnt >= Math.max(goal,1) || (goal===0)){
      streak++;
      cursor = addDays(cursor, -7);
    } else break;
  }

  const thisWeekCount = buckets[currentWeek] ? buckets[currentWeek].size : 0;
  const thisWeekMet = thisWeekCount >= Math.max(goal,1) || goal===0;

  // last 8 weeks dots (oldest -> newest, excluding current)
  const weeks = [];
  for(let i=8;i>=1;i--){
    const wk = addDays(currentWeek, -7*i);
    if(wk < earliestWeek){ weeks.push(null); continue; }
    const cnt = buckets[wk] ? buckets[wk].size : 0;
    weeks.push(cnt >= Math.max(goal,1) || goal===0);
  }

  return {streak, thisWeekCount, goal, weeks, thisWeekMet};
}

function levelFromStreak(streak){ return Math.max(0, Math.min(11, streak)); }

function chickenFootSVG(size){

    <g stroke="#d9ac52" stroke-width="1.3" opacity="0.6">
      <path d="M41 24h18M41 30h18M41 36h18M41 42h18M41 48h18M41 54h18"/>
    </g>
    <path d="M46 60 L36 51" stroke="#f0c869" stroke-width="8" stroke-linecap="round"/>
    <path d="M36 51 l-4 -4" stroke="#8a6a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M46 62 L28 78" stroke="#f0c869" stroke-width="9" stroke-linecap="round"/>
    <path d="M28 78 l-6 3" stroke="#8a6a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 63 L50 86" stroke="#f0c869" stroke-width="9" stroke-linecap="round"/>
    <path d="M50 86 l0 7" stroke="#8a6a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M54 62 L72 78" stroke="#f0c869" stroke-width="9" stroke-linecap="round"/>
    <path d="M72 78 l6 3" stroke="#8a6a2a" stroke-width="3" stroke-linecap="round"/>
  </svg>`;
}

function armBadgeSVG(level, size){
  if(level===0){
    return chickenFootSVG(size);
  }
  const t = level/11;
  const bulgeRx = 9 + level*1.9;
  const bulgeRy = 7 + level*1.35;
  // skin color: pale -> tan -> deep red-orange
  const c1=[232,196,166], c2=[201,124,72], c3=[214,74,46];
  let r,g,b;
  if(t<0.55){ const k=t/0.55; r=c1[0]+(c2[0]-c1[0])*k; g=c1[1]+(c2[1]-c1[1])*k; b=c1[2]+(c2[2]-c1[2])*k; }
  else { const k=(t-0.55)/0.45; r=c2[0]+(c3[0]-c2[0])*k; g=c2[1]+(c3[1]-c2[1])*k; b=c2[2]+(c3[2]-c2[2])*k; }
  const skin = `rgb(${r|0},${g|0},${b|0})`;
  const veinOpacity = level>=8 ? Math.min(1,(level-7)/3.5) : 0;
  const fireOn = level>=11;

  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" class="${fireOn?'flame-glow':''}">
    <line x1="20" y1="83" x2="46" y2="53" stroke="${skin}" stroke-width="24" stroke-linecap="round"/>
    <circle cx="18" cy="85" r="15" fill="${skin}"/>
    <line x1="46" y1="53" x2="70" y2="22" stroke="${skin}" stroke-width="20" stroke-linecap="round"/>
    <circle cx="72" cy="20" r="12" fill="${skin}"/>
    <ellipse cx="49" cy="46" rx="${bulgeRx}" ry="${bulgeRy}" fill="${skin}" transform="rotate(-40 49 46)"/>
    ${veinOpacity>0?`
      <path d="M38,54 Q47,44 54,32" stroke="rgba(90,40,30,${veinOpacity})" stroke-width="1.6" fill="none"/>
      <path d="M43,58 Q52,47 60,36" stroke="rgba(90,40,30,${veinOpacity*0.8})" stroke-width="1.3" fill="none"/>
    `:''}
    ${fireOn?`
      <g opacity="0.92">
        <path d="M49 20c4 6-2 9-1 14 4-1 7-6 5-11 5 4 7 11 2 16-4 4-11 3-13-2-2-4 0-9 3-11z" fill="#ffb35a"/>
        <path d="M49 26c2 3-1 5-1 7 2-1 4-3 3-6 3 2 3 6 0 8-2 2-6 1-7-1-1-2 0-5 2-7z" fill="#ff5a36"/>
      </g>
    `:''}
  </svg>`;
}

/* ===================== IMAGE COMPRESSION ===================== */
function compressImage(dataUrl, maxSize=480, quality=0.72){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      let {width, height} = img;
      if(width>height){ if(width>maxSize){ height*=maxSize/width; width=maxSize; } }
      else { if(height>maxSize){ width*=maxSize/height; height=maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width=width; canvas.height=height;
      canvas.getContext('2d').drawImage(img,0,0,width,height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}

function renderHistoryTab(ex, logs){
  if(logs.length===0){
    return `
      <div class="empty-state">
        ${ICONS.chartBig}
        <p>Ще немає даних для графіка.<br>Запиши перше тренування, і тут з'явиться прогрес.</p>
      </div>`;
  }

  const asc = logs.slice().reverse();
  const points = asc.map(l=>{
    const top = Math.max(...l.sets.map(s=>Number(s.weight)||0));
    return {date:l.date, top, sets:l.sets};
  });

  const maxW = Math.max(...points.map(p=>p.top));
  const minW = Math.min(...points.map(p=>p.top));
  const padding = Math.max(5, Math.round((maxW*0.3)/2.5)*2.5);
  let yMax = Math.ceil((maxW+padding)/5)*5;
  let yMin = Math.max(0, Math.floor((minW-padding)/5)*5);
  if(yMax===yMin) yMax = yMin+10;

  const W=480, H=200, padL=36, padR=12, padT=14, padB=26;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const xStep = points.length>1 ? plotW/(points.length-1) : 0;
  const xOf = i => padL + (points.length>1 ? i*xStep : plotW/2);
  const yOf = v => padT + plotH - ((v-yMin)/(yMax-yMin))*plotH;

  const linePath = points.map((p,i)=>`${i===0?'M':'L'}${xOf(i).toFixed(1)},${yOf(p.top).toFixed(1)}`).join(' ');
  const areaPath = `${linePath} L${xOf(points.length-1).toFixed(1)},${(padT+plotH).toFixed(1)} L${xOf(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  const gridLines = [];
  const steps=4;
  for(let i=0;i<=steps;i++){
    const val = yMin + (yMax-yMin)*i/steps;
    const y = yOf(val);
    gridLines.push(`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`);
    gridLines.push(`<text x="4" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--text-faint)" font-family="JetBrains Mono">${Math.round(val)}</text>`);
  }

  const dateLabels = points.map((p,i)=>{
    if(points.length>6 && i%Math.ceil(points.length/6)!==0 && i!==points.length-1) return '';
    return `<text x="${xOf(i).toFixed(1)}" y="${H-6}" font-size="9" fill="var(--text-faint)" font-family="JetBrains Mono" text-anchor="middle">${fmtDate(p.date)}</text>`;
  }).join('');

  const dots = points.map((p,i)=>`
    <circle cx="${xOf(i).toFixed(1)}" cy="${yOf(p.top).toFixed(1)}" r="4" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"
      data-action="chart-point" data-idx="${i}" style="cursor:pointer"/>
  `).join('');

  const lastEntry = points[points.length-1];
  const best = Math.max(...points.map(p=>p.top));

  return `
    <div class="chart-stats">
      <div class="stat-pill"><div class="num">${best}<span style="font-size:0.6em">кг</span></div><div class="lbl">Максимум</div></div>
      <div class="stat-pill"><div class="num">${lastEntry.top}<span style="font-size:0.6em">кг</span></div><div class="lbl">Останнє</div></div>
      <div class="stat-pill"><div class="num">${points.length}</div><div class="lbl">Тренувань</div></div>
    </div>
    <div class="chart-wrap" style="position:relative;">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible;">
        <defs>
          <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${gridLines.join('')}
        <path d="${areaPath}" fill="url(#areaGrad)"/>
        <path d="${linePath}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
        ${dateLabels}
      </svg>
      <div id="chart-tooltip"></div>
    </div>
    <div class="log-list">
      ${asc.slice().reverse().map(l=>`
        <div class="log-item">
          <div class="l-date">${fmtDate(l.date)}</div>
          <div class="l-sets">
            ${l.sets.map((s,i)=>`<span class="l-set-chip">Сет ${i+1}: <b>${s.reps}</b>×<b>${s.weight}</b>кг</span>`).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

        <div class="big-badge">${armBadgeSVG(level, 62)}</div>
        <div class="streak-num">${info.streak} ${weekWord(info.streak)} поспіль</div>
        <div class="streak-label">${label}</div>
      </div>

      <div class="week-progress">
        <div class="wp-top">
          <span>Цього тижня</span>
          <span class="wp-count">${info.thisWeekCount} / ${goal}</span>
        </div>
        <div class="wp-bar"><div class="wp-bar-fill" style="width:${progressPct}%"></div></div>
      </div>

      <div class="week-dots">
        ${info.weeks.map(w=> w===null ? `<div class="week-dot" style="opacity:0.25"></div>` : `<div class="week-dot ${w?'met':''}"></div>`).join('')}
      </div>

      <button class="primary-btn" data-action="mark-today" ${alreadyToday?'disabled':''}>
        ${alreadyToday ? '✓ Сьогодні вже зараховано' : 'Я потренувався сьогодні'}
      </button>

      <div class="goal-row" style="margin-top:16px;">
        <div class="g-text">
          <div class="g-title">Ціль на тиждень</div>
          <div class="g-hint">Скільки тренувань для заліку тижня</div>
        </div>
        <div class="goal-stepper">
          <button data-action="goal-step" data-d="-1">−</button>
          <div class="g-val" id="goal-val">${goal}</div>
          <button data-action="goal-step" data-d="1">+</button>
        </div>
      </div>
      <div class="info-tip">Тиждень зараховується в стрік, якщо кількість тренувань за тиждень (Пн–Нд) досягає цілі. Якщо ні — стрік скидається на 0.</div>
    </div>
  </div>`;
}
function weekWord(n){
  const m = n%100;
  if(m>=11 && m<=14) return 'тижнів';
  const l = n%10;
  if(l===1) return 'тиждень';
  if(l>=2 && l<=4) return 'тижні';
  return 'тижнів';
}

/* ===================== EVENT HANDLERS ===================== */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  const nameInput = document.getElementById('ex-name-input');
  if(nameInput){ nameInput.oninput = e=>{ modal.name = e.target.value; }; }

  document.querySelectorAll('input[data-role]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const i = +e.target.dataset.i;
      const role = e.target.dataset.role;
      const ex = getExercise(state.exerciseId).ex;
      window.__draftSets[ex.id][i][role] = e.target.value;
    });
  });

  const photoInput = document.getElementById('photo-input');
  if(photoInput){
    photoInput.addEventListener('change', async e=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = async ev=>{
        const compressed = await compressImage(ev.target.result);
        pendingPhoto = compressed;
        render();
      };
      reader.readAsDataURL(file);
    });
  }
}

async function onAction(e){
  e.stopPropagation();
  const el = e.currentTarget;
  const action = el.dataset.action;

  if(action==='open-group'){ state.groupId = el.dataset.id; state.screen='group'; render(); }
  else if(action==='open-exercise'){ state.exerciseId = el.dataset.id; state.exTab='log'; delete window.__draftSets?.[el.dataset.id]; state.screen='exercise'; render(); }
  else if(action==='back'){
    if(state.screen==='exercise') state.screen='group';
    else if(state.screen==='group') state.screen='home';
    render();
  }
  else if(action==='ex-tab'){ state.exTab = el.dataset.tab; render(); }

  else if(action==='add-exercise'){ modal={type:'add-exercise', name:''}; pendingPhoto=null; render(); }
  else if(action==='edit-exercise'){ modal={type:'edit-exercise'}; pendingPhoto=null; render(); }
  else if(action==='delete-exercise'){
    const found = getExercise(state.exerciseId);
    if(found && confirm(`Видалити вправу "${found.ex.name}"?`)){
      DB.exercises[found.groupId] = DB.exercises[found.groupId].filter(x=>x.id!==state.exerciseId);
      delete DB.logs[state.exerciseId];
      persistExercises(); persistWorkoutData();
      state.screen='group'; render();
    }
  }
  else if(action==='pick-photo'){ document.getElementById('photo-input').click(); }
  else if(action==='close-modal' || action==='close-modal-bg'){
    if(action==='close-modal-bg' && el !== e.target) return;
    modal=null; pendingPhoto=null; render();
  }
  else if(action==='save-new-exercise'){
    const name = (modal.name||'').trim();
    if(!name){ shake('ex-name-input'); return; }
    const newEx = {id:uid(), name, photo: pendingPhoto||null};
    DB.exercises[state.groupId].push(newEx);
    persistExercises();
    modal=null; pendingPhoto=null; render();
  }
  else if(action==='save-edit-exercise'){
    const nameInput = document.getElementById('ex-name-input');
    const name = (nameInput.value||'').trim();
    if(!name){ shake('ex-name-input'); return; }
    const found = getExercise(state.exerciseId);
    found.ex.name = name;
    if(pendingPhoto!==null) found.ex.photo = pendingPhoto;
    persistExercises();
    modal=null; pendingPhoto=null; render();
  }

  else if(action==='step-reps' || action==='step-weight'){
    const i = +el.dataset.i;
    const d = parseFloat(el.dataset.d);
    const ex = getExercise(state.exerciseId).ex;
    const role = action==='step-reps' ? 'reps' : 'weight';
    const cur = parseFloat(window.__draftSets[ex.id][i][role]) || 0;
    let next = cur + d;
    if(next<0) next=0;
    window.__draftSets[ex.id][i][role] = role==='weight' ? (Math.round(next*2)/2) : Math.round(next);
    render();
  }
  else if(action==='save-log'){
    const ex = getExercise(state.exerciseId).ex;
    const draft = window.__draftSets[ex.id];
    const validSets = draft
      .map(r=>({reps:parseFloat(r.reps)||0, weight:parseFloat(r.weight)||0}))
      .filter(r=>r.reps>0);
    if(validSets.length===0){ alert('Заповни хоча б один сет (повторення).'); return; }
    const today = todayISO();
    const existingIdx = (DB.logs[ex.id]||[]).findIndex(l=>l.date===today);
    if(!DB.logs[ex.id]) DB.logs[ex.id] = [];
    if(existingIdx>=0) DB.logs[ex.id][existingIdx] = {date:today, sets:validSets};
    else DB.logs[ex.id].push({date:today, sets:validSets});
    if(!DB.trainingDays.includes(today)) DB.trainingDays.push(today);
    persistWorkoutData();
    delete window.__draftSets[ex.id];
    state.exTab='history';
    render();
  }
  else if(action==='chart-point'){
    // handled via mouseover/tap below (simplified: show alert-free tooltip inline)
  }

  else if(action==='open-streak'){ modal={type:'streak'}; render(); }
  else if(action==='mark-today'){
    const today = todayISO();
    if(!DB.trainingDays.includes(today)){
      DB.trainingDays.push(today);
      persistWorkoutData();
      render();
    }
  }
  else if(action==='goal-step'){
    const d = parseInt(el.dataset.d);
    DB.settings.weeklyGoal = Math.max(0, Math.min(7, DB.settings.weeklyGoal + d));
    persistSettings();
    render();
  }
}

function shake(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.style.borderColor = 'var(--danger)';
  setTimeout(()=>{ el.style.borderColor = 'var(--border)'; }, 700);
}

/* chart tooltip via delegated hover/tap */
document.addEventListener('click', e=>{
  const pt = e.target.closest('[data-action="chart-point"]');
  const tipHost = document.getElementById('chart-tooltip');
  if(!pt){ if(tipHost) tipHost.innerHTML=''; return; }
  e.stopPropagation();
  const idx = +pt.dataset.idx;
  const found = getExercise(state.exerciseId);
  if(!found) return;
  const logs = (DB.logs[found.ex.id]||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const entry = logs[idx];
  if(!entry || !tipHost) return;
  const cx = pt.getAttribute('cx'), cy = pt.getAttribute('cy');
  const svg = pt.closest('svg');
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const px = rect.left + (cx/vb.width)*rect.width;
  const py = rect.top + (cy/vb.height)*rect.height;
  const wrapRect = tipHost.parentElement.getBoundingClientRect();
  tipHost.innerHTML = `<div class="tooltip" style="left:${px-wrapRect.left}px; top:${py-wrapRect.top}px;">
    <div class="t-date">${fmtDate(entry.date)}</div>
    <div class="t-sets">${entry.sets.map(s=>`${s.reps}×${s.weight}кг`).join(' · ')}</div>
  </div>`;
});

/* ===================== INIT ===================== */
(async function init(){
  document.getElementById('app').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:var(--text-dim);font-family:'Manrope',sans-serif;">Завантаження…</div>`;
  await loadAll();
  render();
})();
</script>
